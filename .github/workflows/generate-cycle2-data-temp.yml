name: Temporary Cycle 2 data generation

on:
  push:
    branches:
      - codex/chapters-08-10

permissions:
  contents: write

jobs:
  generate:
    if: github.event.head_commit.message != 'data: add generated StatsBomb teaching sample'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/chapters-08-10
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fetch ten Bundesliga matches
        run: python scripts/fetch-statsbomb-sample.py 9 281 --limit 10
      - name: Generate teaching dataset
        run: python scripts/prepare-shots.py data/raw/statsbomb/9/281/events/*.json -o src/data/statsbomb-shots.generated.json
      - name: Commit generated sample
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/statsbomb-shots.generated.json
          git commit -m "data: add generated StatsBomb teaching sample"
          git push origin HEAD:codex/chapters-08-10
