name: Temporary StatsBomb data smoke

on:
  push:
    branches:
      - codex/cycle-2-shaping-data

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fetch one real match
        run: python scripts/fetch-statsbomb-sample.py 9 281 --limit 1
      - name: Convert real shots
        run: python scripts/prepare-shots.py data/raw/statsbomb/9/281/events/*.json -o /tmp/shots.json
      - name: Check generated dataset
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/shots.json').read_text())
          shots = data['shots']
          assert shots, 'No shots generated'
          goals = sum(shot['goal'] for shot in shots)
          required = {'distance', 'angle', 'body_part', 'shot_type', 'statsbomb_xg_reference', 'provenance'}
          assert required.issubset(shots[0]), shots[0].keys()
          print({'shots': len(shots), 'goals': goals, 'sample': shots[0]})
          PY
